<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice Areas — Mobile Preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eef0f6;display:grid;place-items:center;padding:40px 16px;font-family:'Lato','Helvetica Neue',system-ui,sans-serif}
.stage{display:flex;flex-direction:column;align-items:center;gap:22px}
.cap{font-weight:700;color:#2E3192;font-size:15px;letter-spacing:.02em}
.cap span{color:#6B7080;font-weight:500}
.phone{position:relative;width:410px;height:860px;background:#0c0d14;border-radius:56px;padding:14px;box-shadow:0 40px 90px rgba(31,34,102,.28),0 0 0 2px #23252f}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#0c0d14;border-radius:20px;z-index:5}
.status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:18px 30px 0;z-index:4;pointer-events:none}
.status .t{font-weight:700;font-size:15px;color:#1C1F2A}
.status .r{display:flex;gap:6px;align-items:center;font-size:13px;color:#1C1F2A}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:44px}
</style></head><body>
<div class="stage">
<div class="cap">Practice Areas <span>· iPhone 390 × 844</span></div>
<div class="phone"><div class="screen">
<div class="notch"></div>
<div class="status"><div class="t">9:41</div><div class="r">5G&nbsp;&nbsp;100%</div></div>
<iframe src="practice-areas.html" title="Practice Areas mobile"></iframe>
</div></div>
</div>
</body></html>
